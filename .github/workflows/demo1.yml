name: Events Demo 1
on: 
  push:
    branches: 
      - andrejs
      - main
  pull_request: 
    types: [opened]

    branches: 
      - andrejs

jobs:
  build:
    runs-on: ubuntu-latest
    outputs: 
      getGithubEvent: ${{steps.getEvent.outputs.value}}

    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Save output
        id: getEvent
        run: echo "value=${{toJson(github.event)}}" >> "$GITHUB_OUTPUT" 
  
  displayEvent:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Display event
        run: echo ${{needs.build.outputs.getGithubEvent}}